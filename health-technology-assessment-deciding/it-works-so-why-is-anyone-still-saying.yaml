playlist:
  title: It works. So why is anyone still saying no?
---
title: It works. So why is anyone still saying no?
voice: male
template: cost_effectiveness_plane
params:
  title: The two halves of the question
  x_label: Incremental effect, ΔE (QALYs)
  y_label: Incremental cost, ΔC (kr)
  wtp_threshold: 275000
  points:
    - label: Nusinersen (SMA)
      effect: 2
      cost: 6000000
      emphasize: true
    - label: Hip replacement
      effect: 1
      cost: 80000
elements:
  - id: mark_lambda
    type: annotation
    target: wtp_label
    kind: box
commands:
  - draw:
      - x_axis
    speak: 'Over four parts, this series answers one question: when a treatment plainly works, how can a health system still say no? Everything turns on two axes — along here, the health a treatment adds, measured in QALYs.'
  - draw:
      - y_axis
    speak: 'And upward, what it costs. Delta E and delta C: the effect and the cost of a new technology, both measured against current care.'
  - pause: 1
  - ask:
      intro: One question before we begin.
      question: What should I call you?
      store: name
      default: friend
  - draw:
      - q_ne
      - q_nw
      - q_se
      - q_sw
    parallel: true
    speak: 'Four quadrants, {name}: cheaper or costlier, better or worse than what we already do.'
  - erase:
      - q_nw
      - q_se
      - q_sw
    speak: Almost every new drug worth arguing about lands in one of them — the top right, where it works and it costs more.
  - pause: 1
  - draw:
      - pt_0
      - pt_label_0
    speak: 'Our running example: nusinersen, sold as Spinraza, for spinal muscular atrophy — in its severe infant form, a disease that used to kill or permanently ventilate most children before their second birthday.'
  - highlight:
      target:
        - pt_0
      effect: glow
    speak: 'And it works: in the pivotal infant trial, none of the untreated babies reached the motor milestones, while about half of the treated ones did.'
  - pause: 1
  - draw:
      - wtp_line
      - wtp_label
    speak: Now the half of the question no efficacy trial asks. This line is lambda — Norway's rough willingness to pay, around 275,000 kroner per QALY for a gain of ordinary alvorlighet, that is, severity.
  - point:
      at:
        ref: pt_0
      gesture: circle
    speak: 'Nusinersen sat far above it: at list price, millions of kroner per patient per year, and delta C over delta E — the ICER — landed in the millions per QALY, roughly ten times the line.'
  - pause: 1
  - draw:
      - pt_1
      - pt_label_1
    speak: For contrast, here, almost hugging the origin, sits a hip replacement — about one QALY gained for something like eighty thousand kroner.
  - camera:
      center:
        ref: pt_1
      zoom: 3
    speak: 'Zoom in, and it rests quietly below the line: unglamorous, high-volume, no headlines, and far more health for every krone.'
  - camera:
      reset: true
    speak: Pull back out. The we that pays for the dot up there is one budget — four regional health authorities deciding jointly in Beslutningsforum — so a krone spent here cannot be spent there.
  - draw:
      - mark_lambda
    speak: So the honest question is nytte and ressursbruk together — benefit and resource use — and that binds any payer with a fixed budget, a private clinic as much as a public system.
  - draw:
      - title
    speak: Beslutningsforum first said no to nusinersen, then yes for patients under eighteen once the price came down — the dot moved, the evidence didn't.
  - pause: 1
  - speak: 'It works, and someone still says no, because a yes is never a claim about the effect alone — it is a claim about where the effect sits relative to its price. Next: why effect alone can never settle it.'
    delivery: grave
level: basic
---
title: Effect is not enough
voice: male
elements:
  - id: caption
    type: text
    text: Nusinersen (1) vs current care (0) — one patient, lifetime, discounted
    x: 500
    'y': 700
    font_size: 22
    style:
      color: '#8f887c'
  - id: col0_head
    type: text
    text: Current care (0)
    x: 530
    'y': 645
    font_size: 28
    style:
      color: '#2f6b8f'
  - id: col1_head
    type: text
    text: Nusinersen (1)
    x: 800
    'y': 645
    font_size: 28
    style:
      color: '#b5482e'
  - id: head_rule
    type: path
    points:
      - - 80
        - 610
      - - 930
        - 610
    style:
      color: '#8f887c'
      stroke_width: 1.5
  - id: col_divider
    type: path
    points:
      - - 665
        - 600
      - - 665
        - 415
    style:
      color: '#8f887c'
      dash: true
      stroke_width: 1.2
  - id: row_e_label
    type: text
    text: Effect  E  (QALYs)
    x: 210
    'y': 545
    font_size: 26
  - id: e0
    type: text
    text: '12.0'
    x: 530
    'y': 545
    font_size: 32
    style:
      color: '#2f6b8f'
  - id: e1
    type: text
    text: '16.0'
    x: 800
    'y': 545
    font_size: 32
    style:
      color: '#b5482e'
  - id: row_c_label
    type: text
    text: Cost  C  (kr)
    x: 210
    'y': 455
    font_size: 26
  - id: c0
    type: text
    text: 2 mill
    x: 530
    'y': 455
    font_size: 32
    style:
      color: '#2f6b8f'
  - id: c1
    type: text
    text: 22 mill
    x: 800
    'y': 455
    font_size: 32
