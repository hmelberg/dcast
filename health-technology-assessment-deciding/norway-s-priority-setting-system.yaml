    type: text
    text: 5 of 20
    x: 500
    'y': 300
    font_size: 26
    style:
      opacity: 0.7
    draw:
      mode: sketch
      duration: 0.7
commands:
  - draw:
      - nx_kicker
      - nx_title
      - nx_line
    speak: 'Next: Whose costs count? The perspective question decides the answer'
  - draw:
      - nx_count
  - pause: 1.5
