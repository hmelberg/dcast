commands:
  - draw:
      - title
      - divider
    speak: 'Now that we have seen the WHO''s own authors withdraw their GDP rule, let''s do the arithmetic they were avoiding: what an inflated lambda costs, counted in health.'
  - draw:
      - left_head
      - l1
      - l2
    speak: 'On the left, the decision everyone sees: a hundred million kroner for a new drug at roughly a million kroner per QALY — the order of magnitude published analyses report for nusinersen at list price.'
  - draw:
      - l3
    speak: That buys a hundred quality-adjusted life years, in children we can name.
  - pause: 0.4
  - draw:
      - right_head
      - r1
      - r2
    speak: 'On the right, the decision nobody reports: in a fixed budget that money leaves care already running at the margin — Norway''s 2016 white paper set the reference value at 275,000 kroner per good life year.'
  - draw:
      - r3
    speak: Left where it was, the same hundred million produces about three hundred and sixty-four QALYs — statins started, hips replaced, the boring high-volume work.
  - draw:
      - net_text
      - mark_net
    speak: So the approval is not a gain of a hundred life years. It is a net loss of two hundred and sixty-four.
    delivery: grave
  - point:
      at:
        ref: net_text
      gesture: underline
    speak: Every lambda above the margin runs this subtraction, whether or not anyone writes it down.
  - clear:
      keep:
        - net_text
        - mark_net
  - draw:
      - head2
      - p_named
      - label_named
    speak: 'One side of it we can see: a named child, a photograph, a hearing — Beslutningsforum said no in 2017, then yes in 2018 with an age limit.'
  - draw:
      - c1
      - c2
      - c3
      - c4
      - c5
      - c6
      - c7
      - c8
    parallel: true
    speak: 'The other side we cannot: the displaced health is thin and scattered, a delayed hip here, a statin never started there.'
  - draw:
      - label_crowd
    speak: Not one of them will ever appear in a record as the person who lost a life year to this decision.
  - focus:
      target:
        - c1
        - c2
        - c3
        - c4
        - c5
        - c6
        - c7
        - c8
        - label_crowd
    speak: 'Thomas Schelling named this in 1968: the identified life gets a headline, the statistical life gets nothing — though it is just as dead.'
  - draw:
      - debate_1
    speak: 'And the field genuinely splits here: NICE has held twenty to thirty thousand pounds since the early 2000s, a range never derived from evidence about what actually gets displaced.'
  - draw:
      - debate_2
    speak: Claxton and colleagues measured the NHS margin at about thirteen thousand; critics call the estimate fragile, extrapolating from mortality to quality of life — the authors answer that even a wide error band leaves NICE above the margin. Unresolved.
  - draw:
      - closing
      - mark_closing
    speak: 'Which leaves a modest obligation: if you set lambda above the margin, say out loud that you are buying less health, and say what you are buying instead — severity, rarity, a promise kept.'
  - speak: 'Across this series: the threshold is not what society says it will pay, it is what the next krone already buys — and everything approved above it is paid for by patients you will never meet.'
    delivery: grave
level: advanced
