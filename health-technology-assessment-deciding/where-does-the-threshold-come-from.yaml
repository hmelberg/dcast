playlist:
  title: Where does the threshold come from - willingness to pay, or what we displace?
---
title: The Line You Have Been Drawing
level: advanced
voice: female
template: cost_effectiveness_plane
params:
  title: The line you have been drawing
  wtp_threshold: 275000
  x_label: ΔE — QALYs gained
  y_label: ΔC — incremental cost (kr)
  points:
    - label: Nusinersen (SMA)
      effect: 2.5
      cost: 5000000
      emphasize: true
    - label: Hip replacement
      effect: 1
      cost: 100000
elements:
  - id: head
    type: text
    text: Where does λ come from?
    x: 500
    'y': 630
    font_size: 34
  - id: r1
    type: text
    text: Demand side — what society will pay
    x: 500
    'y': 530
    font_size: 26
    style:
      color: '#b5482e'
  - id: r2
    type: text
    text: Supply side — what the marginal krone buys
    x: 500
    'y': 455
    font_size: 26
    style:
      color: '#2f6b8f'
  - id: r3
    type: text
    text: £20–30,000 against £13,000
    x: 500
    'y': 380
    font_size: 26
  - id: r4
    type: text
    text: The WHO rule its authors withdrew
    x: 500
    'y': 305
    font_size: 26
  - id: r5
    type: text
    text: Who dies when λ is set too high
    x: 500
    'y': 230
    font_size: 26
commands:
  - draw:
      - title
      - x_axis
      - y_axis
    speak: You have been drawing a threshold line through this plane for fifteen lectures — this series asks where its slope actually came from, because that one number decides who gets treated.
  - draw:
      - q_nw
      - q_ne
      - q_sw
      - q_se
    parallel: true
  - draw:
      - pt_0
      - pt_label_0
    speak: 'Take nusinersen for spinal muscular atrophy: on the order of two to three QALYs per patient, at a list price of seven hundred and fifty thousand dollars in the first year and three hundred and seventy-five thousand every year after.'
  - pause: 0.3
  - draw:
      - pt_1
      - pt_label_1
    speak: And here, almost hugging the origin, a hip replacement — roughly one QALY for about a hundred thousand kroner.
  - point:
      at:
        ref: pt_1
      gesture: circle
    speak: Same plane, same currency, two orders of magnitude apart in what a krone buys.
  - pause: 0.4
  - draw:
      - wtp_line
      - wtp_label
    speak: The line between them has slope lambda — around two hundred and seventy-five thousand kroner per QALY, the alternative-cost figure the Magnussen group proposed in 2015, which severity can lift to roughly three times that.
  - highlight:
      target:
        - pt_0
      effect: glow
    speak: Below the line you buy, above it you don't, and nusinersen sits far above — which is why Beslutningsforum said no in 2017, then yes in 2018 with an age limit.
  - pause: 0.5
  - animate:
      wtp_threshold: 2200000
    duration: 3
    speak: 'Now watch a steeper slope: the same drug, the same evidence, quietly becomes cost-effective.'
  - animate:
      wtp_threshold: 275000
    duration: 2.5
    speak: Let it fall back and those same children are unaffordable again — nothing about the medicine moved, only a number no trial ever measured.
    delivery: grave
  - focus:
      target:
        - wtp_line
        - wtp_label
    speak: 'Which is why the slope is fought over: NICE''s famous twenty to thirty thousand pounds per QALY was never derived from data, while Claxton and colleagues, estimating what the NHS actually buys at the margin, arrived at about thirteen thousand.'
  - pause: 0.5
  - clear: {}
    speak: So four answers are owed to you, one for each part still to come.
  - draw:
      - head
      - r1
      - r2
    speak: 'Either lambda is demand-side — what society is willing to pay for a year of health — or supply-side: what the marginal krone already buys somewhere else in the budget.'
  - draw:
      - r3
    speak: Then the collision, and what a system should do when its own line is twice as generous as its own productivity.
  - draw:
      - r4
    speak: Then the WHO's rule of one to three times GDP per capita — a threshold its own authors publicly asked the world to stop using.
  - draw:
      - r5
    speak: And the patients on the far side of the line, who lose health whenever we overpay, and whom no registry ever names.
  - highlight:
      target:
        - head
      effect: glow
    speak: So lambda was never a statement about money we are willing to spend — it is a claim about the health we are about to destroy.
---
title: Two Ways to Justify Lambda
level: advanced
voice: female
template: pathway
params:
  title: Two ways to justify lambda
  edges: Threshold lambda -> Demand side; Demand side -> Over 1 million kr per QALY; Threshold lambda -> Supply side; Supply side -> About 275 000 kr per QALY
  node_types:
    Threshold lambda: gene
elements:
  - id: t_head
    type: text
    x: 500
    'y': 665
    text: Say yes at 1 000 000 kr per QALY
    font_size: 30
  - id: t_spend
    type: text
    x: 500
    'y': 615
    text: 10 million kroner, out of a fixed budget
    font_size: 24
    style:
      color: '#8f887c'
  - id: bar_gain
    type: path
    points:
      - - 180
        - 520
      - - 280
        - 520
      - - 280
        - 560
      - - 180
        - 560
    closed: true
    style:
      fill: '#87a878'
  - id: lbl_gain
    type: label
    text: 10 QALYs gained
    attach_to: bar_gain
    side: right
    style:
      color: '#87a878'
  - id: bar_lost
    type: path
    points:
      - - 180
        - 430
      - - 540
        - 430
      - - 540
        - 470
      - - 180
        - 470
    closed: true
    style:
      fill: '#c96567'
  - id: lbl_lost
    type: label
    text: 36 QALYs displaced
    attach_to: bar_lost
    side: right
    style:
      color: '#c96567'
  - id: t_net
    type: text
    x: 500
    'y': 335
    text: 'Net: 26 QALYs destroyed'
    font_size: 32
    style:
      color: '#b5482e'
  - id: mark_net
    type: annotation
    target: t_net
    kind: box
  - id: t_close
    type: text
    x: 500
    'y': 235
    text: 'Nusinersen: no in 2017, yes in 2018 — age limit, negotiated price'
    font_size: 22
    style:
      color: '#8f887c'
commands:
  - draw:
      - title
      - node_threshold_lambda
      - node_label_threshold_lambda
    speak: Now that we have seen the threshold drawn as a line through the origin, the honest question is where its slope, lambda, actually comes from — because two respectable ways of answering give numbers four times apart.
  - draw:
      - edge_0
      - node_demand_side
      - node_label_demand_side
    speak: 'One answer looks outward, at society: how much are we willing to pay for a quality-adjusted life year?'
  - draw:
      - edge_1
      - node_over_1_million_kr_per_qaly
      - node_label_over_1_million_kr_per_qaly
    speak: Norwegian cost-benefit guidance values a statistical life at thirty million kroner — spread over the life years behind that figure, more than a million kroner per life year.
  - pause: 0.4
  - draw:
      - edge_2
      - node_supply_side
      - node_label_supply_side
    speak: 'The other answer looks inward, at the budget we already have: what does the last krone in it currently buy?'
  - draw:
      - edge_3
      - node_about_275_000_kr_per_qaly
      - node_label_about_275_000_kr_per_qaly
    speak: Norway's 275,000 kroner per good life year was defended as an estimate of exactly that — the health quietly produced at the margin.
  - focus:
      target:
        - node_demand_side
        - node_label_demand_side
        - node_over_1_million_kr_per_qaly
        - node_label_over_1_million_kr_per_qaly
        - edge_0
        - edge_1
    speak: The left branch is a statement about values — what a life year ought to be worth to us.
  - focus:
      target:
        - node_supply_side
        - node_label_supply_side
        - node_about_275_000_kr_per_qaly
        - node_label_about_275_000_kr_per_qaly
        - edge_2
        - edge_3
    speak: The right branch is a measurement — how much health the system loses when that money goes somewhere else.
  - clear: {}
    speak: Two different questions, so no reason their answers should agree — and the gap between them is not academic.
  - draw:
      - t_head
      - t_spend
    speak: Say we approve a treatment priced at a million kroner per QALY, costing the system ten million.
  - draw:
      - bar_gain
      - lbl_gain
    speak: Ten million at a million per QALY buys ten quality-adjusted life years, for patients with names and faces.
  - pause: 0.3
  - draw:
      - bar_lost
      - lbl_lost
    speak: 'But that money was already busy: at 275,000 kroner per QALY, the services it leaves behind were producing thirty-six.'
  - draw:
      - t_net
      - mark_net
    speak: So the yes is not a gain of ten — it is a net loss of twenty-six life years.
    delivery: grave
  - highlight:
      target:
        - bar_lost
      effect: glow
    speak: 'That is the supply-side case, made by Claxton, Culyer and colleagues: with a fixed budget, any lambda above the margin makes the health service destroy health.'
  - point:
      at:
        ref: t_head
      gesture: underline
    speak: 'The demand-side reply stings: a supply-side threshold can only ratify whatever budget politicians happened to set, and can never argue that the budget itself is too small.'
  - draw:
      - t_close
    speak: Nusinersen shows how the argument actually ends — Beslutningsforum said no in 2017 and yes in 2018, with an age limit and a negotiated price, while the threshold itself never moved.
  - speak: Demand-side lambda asks what a life year is worth to us; supply-side lambda asks what it costs the patients we displace — and only the second number can tell you when a yes does harm.
---
title: 20–30,000 vs 13,000
level: advanced
voice: female
domain:
  x:
    - 0
    - 1
  'y':
    - 0
    - 30000
elements:
  - id: ax
    type: axes
    x_label: ΔE — QALYs gained per patient
    y_label: ΔC — extra cost (£)
  - id: nice_high
    type: curve
    expr: 30000*x
    style:
      color: '#2f6b8f'
  - id: nice_low
    type: curve
    expr: 20000*x
    style:
      color: '#2f6b8f'
  - id: nice_band
    type: region
    between:
      - nice_low
      - nice_high
    style:
      fill: '#2f6b8f'
      opacity: 0.12
  - id: label_nice
    type: label
    text: 'NICE: £20 000–30 000 per QALY'
    attach_to: nice_high
    side: above-left
    style:
      color: '#2f6b8f'
  - id: claxton_line
    type: curve
    expr: 13000*x
    style:
      color: '#b5482e'
  - id: label_claxton
    type: label
    text: 'Claxton et al. 2015: ≈ £13 000 per QALY'
    attach_to: claxton_line
    side: below-right
    style:
      color: '#b5482e'
  - id: loss_wedge
    type: region
    between:
      - claxton_line
      - nice_low
    style:
      fill: '#c96567'
      opacity: 0.18
  - id: drug
    type: point
    at:
      x: 0.5
      'y': 10000
    guides: true
  - id: label_drug
    type: label
    text: 'New drug: ΔE = 0.5, ΔC = £10 000'
    attach_to: drug
    side: above-left
  - id: displaced
    type: point
    at:
      x: 0.769
      'y': 10000
    style:
      color: '#b5482e'
  - id: label_displaced
    type: label
    text: 0.77 QALYs displaced
    attach_to: displaced
    side: right
    style:
      color: '#b5482e'
  - id: nmb_arrow
    type: arrow
    from:
      x: 0.5
      'y': 6500
    to:
      x: 0.5
      'y': 10000
    style:
      color: '#b5482e'
  - id: label_nmb
    type: label
    text: 'NMB at λ = 13 000: −£3 500'
    attach_to: nmb_arrow
    side: left
    style:
      color: '#b5482e'
  - id: mark_nmb
    type: annotation
    target: label_nmb
    kind: box
  - id: label_norway
    type: label
    text: 'Norway: ≈ 275 000 kr per QALY, before severity weighting'
    attach_to: claxton_line
    side: right
    style:
      color: '#8f887c'
commands:
  - draw:
      - ax
    speak: Now that we have seen the two ways to justify lambda — what society says it will pay, and what the budget's last pound already buys — let's put real numbers on both.
  - draw:
      - nice_low
      - nice_high
      - nice_band
      - label_nice
    speak: 'This blue band is England''s stated number: NICE has judged technologies against twenty to thirty thousand pounds per QALY since 2004.'
  - pause: 0.3
  - draw:
      - claxton_line
      - label_claxton
    speak: 'And this red line is the other kind of number: in 2015 Karl Claxton and colleagues at York estimated what NHS spending actually produces at the margin — about thirteen thousand pounds per QALY.'
  - draw:
      - loss_wedge
    speak: Between them sits a wedge of technologies England approves at a price its own health service cannot produce health for.
  - pause: 0.5
  - draw:
      - drug
      - label_drug
    speak: 'Take a concrete case: a drug gaining half a QALY per patient at ten thousand pounds more than current care.'
  - highlight:
      target:
        - nice_low
      effect: glow
    speak: Its ICER — ten thousand divided by nought point five — is twenty thousand pounds per QALY, exactly on the lower edge of the range, so it passes.
  - pause: 0.3
  - draw:
      - displaced
      - label_displaced
    speak: But that ten thousand pounds comes out of a budget producing health at thirteen thousand a QALY, so spending it here removes about nought point seven seven QALYs from patients nobody names.
  - draw:
      - nmb_arrow
      - label_nmb
    speak: 'Half a QALY bought, three quarters lost: net monetary benefit at lambda thirteen thousand is minus three thousand five hundred pounds per patient.'
  - draw:
      - mark_nmb
    speak: Approved and health-destroying at the same time — the difference is entirely which lambda you believe.
    delivery: grave
  - pause: 0.5
  - focus:
      target:
        - claxton_line
        - label_claxton
    speak: 'So what should move when the two disagree? Claxton''s answer is blunt: if the service produces at thirteen thousand, that is the threshold, and the stated range is simply too high.'
  - focus:
      target:
        - nice_low
        - nice_high
        - nice_band
        - label_nice
    speak: NICE has not moved its range, and critics of the estimate argue it leans on strong assumptions — that tightening budgets cut the least productive services first, and that national spending data can be read as causal.
  - highlight:
      target:
        - loss_wedge
      effect: glow
    speak: 'Culyer and colleagues offered a third reading: a threshold is something to be searched for, not chosen — and if society truly values a QALY at thirty thousand, the gap argues for a bigger budget, not for ignoring the displacement.'
  - draw:
      - label_norway
    speak: 'Norway took the supply-side route explicitly: an estimated alternative cost of roughly 275 000 kroner per good year, then scaled upward with alvorlighet — severity.'
  - highlight:
      target:
        - drug
      effect: pulse
    speak: Nusinersen, our running example, sat far above every line on this figure — which is why that fight was about price and severity, never about which threshold was right.
  - speak: 'A threshold is not a preference: it is a claim about what the last krone in the budget is already producing — and every approval above it is financed in health that never appears in anyone''s data.'
    delivery: grave
---
title: The Patients You Never Meet, Counted
voice: female
elements:
