title: 'Cost-minimisation: the hidden assumption'
voice: male
template: cost_effectiveness_plane
params:
  title: One saving, three possible effects
  wtp_threshold: 275000
  points:
    - label: CMA assumes ΔE = 0
      effect: 0
      cost: -20000
      emphasize: true
    - label: ΔE = −0.15 QALY
      effect: -0.15
      cost: -20000
    - label: ΔE = +0.19 QALY
      effect: 0.19
      cost: -20000
elements:
  - id: nmb_title
    type: text
    text: NMB = λ·ΔE − ΔC,   λ = 275 000 kr per QALY
    x: 500
    'y': 620
    font_size: 30
  - id: nmb_a
    type: text
    text: 'ΔE = 0:      0 + 20 000  =  +20 000 kr'
    x: 500
    'y': 495
    font_size: 27
  - id: nmb_b
    type: text
    text: 'ΔE = −0.15:   −41 250 + 20 000  =  −21 250 kr'
    x: 500
    'y': 410
    font_size: 27
    style:
      color: '#b5482e'
  - id: nmb_c
    type: text
    text: 'ΔE = +0.19:   +52 250 + 20 000  =  +72 250 kr'
    x: 500
    'y': 325
    font_size: 27
    style:
      color: '#2f6b8f'
  - id: verdict
    type: text
    text: The sign of the answer is unknown — and CMA never asks
    x: 500
    'y': 195
    font_size: 28
  - id: verdict_box
    type: annotation
    target: verdict
    kind: box
  - id: caveat
    type: text
    text: Equivalence must be designed in, never inferred from p > 0.05
    x: 500
    'y': 105
    font_size: 23
    style:
      color: '#8f887c'
commands:
  - draw:
      - x_axis
      - y_axis
    speak: Now that we have seen CEA, CUA and CBA side by side, here is the fourth label on the list — the one that claims to need no effect measure at all.
  - draw:
      - q_ne
      - q_nw
      - q_se
      - q_sw
    parallel: true
  - draw:
      - pt_0
      - pt_label_0
    speak: 'Our new formulation lands here: twenty thousand kroner cheaper per patient, and — by assumption — exactly no difference in health.'
  - highlight:
      target:
        - pt_0
      effect: glow
    speak: 'Sitting precisely on the vertical axis is a very strong claim: with ΔE zero there is no ratio to compute and nothing to weigh, so you simply buy the cheaper one.'
  - pause: 0.5
  - draw:
      - pt_1
      - pt_label_1
      - pt_2
      - pt_label_2
    speak: But that zero came from a trial, and its confidence interval ran from a loss of 0.15 QALYs to a gain of 0.19 — every point along this stretch fits the data equally well.
  - focus:
      target:
        - pt_1
        - pt_2
        - pt_label_1
        - pt_label_2
    speak: A p-value of 0.62 says we failed to detect a difference; it does not say we established there is none — the study was simply too small to tell a seventh of a life-year from zero.
  - draw:
      - wtp_line
      - wtp_label
    speak: Bring in the threshold, 275 000 kroner per quality-adjusted life year, and that stretch stops being abstract.
  - highlight:
      target:
        - pt_1
      effect: glow
    speak: 'At the lower limit the point sits above the threshold line: we would be surrendering health worth more than the money we saved.'
  - clear: {}
  - draw:
      - nmb_title
    speak: 'Net monetary benefit makes the same comparison in kroner: the health difference valued at the threshold, minus the extra cost.'
  - draw:
      - nmb_a
    speak: If the effects truly are identical, the new formulation is worth twenty thousand kroner per patient — and cost-minimisation's answer is the right one.
  - draw:
      - nmb_b
    speak: At the bottom of the interval, the health given up is worth forty-one thousand, so the saving no longer covers it and net benefit turns negative.
  - draw:
      - nmb_c
    speak: At the top it is cheaper and better — seventy-two thousand kroner of net benefit, a clear yes.
  - draw:
      - verdict
      - verdict_box
    speak: One trial, and it supports a confident yes and a confident no; cost-minimisation reports the middle number and calls the matter settled.
    delivery: grave
  - draw:
      - caveat
    speak: It is not always wrong — when equivalence is built into the design, a biosimilar with a formal equivalence trial, or the same infusion given at home instead of in hospital, comparing resource use alone is honest and quick.
  - speak: Applied to a non-significant result, though, it asserts an equivalence nobody ever tested — which is why Briggs and O'Brien asked, in a 2001 paper, whether cost-minimisation analysis was dead.
  - speak: 'So run the full analysis and show the uncertainty: a zero you assumed is not a zero you measured.'
level: basic
