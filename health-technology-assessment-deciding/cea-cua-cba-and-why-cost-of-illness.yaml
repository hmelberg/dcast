commands:
  - draw:
      - title
    speak: Now that we have seen one drug asked four different questions, the practical problem is which of those answers a committee can actually act on.
  - draw:
      - vline1
      - vline2
      - vline3
      - hhead
      - h1
      - h2
      - h3
    parallel: true
  - draw:
      - h_cea
      - h_cua
      - h_cba
    parallel: true
    speak: Cost-effectiveness, cost-utility, cost-benefit — the arithmetic is identical in all three; only the unit in the denominator changes.
  - pause: 0.3
  - draw:
      - rl1
      - c1_cea1
      - c1_cea2
    speak: 'Row one: what is compared. Cost-effectiveness sets two options against a single clinical outcome — infections avoided, cases detected, motor milestones reached.'
  - draw:
      - c1_cua1
      - c1_cua2
    speak: 'Cost-utility takes the same two options but scores health as a whole: years of life weighted by the utility of living them.'
  - draw:
      - c1_cba1
      - c1_cba2
    speak: Cost-benefit compares any two uses of the same money — a drug against a road, if you like.
  - pause: 0.4
  - draw:
      - rl2
      - c2_cea1
      - c2_cea2
      - c2_cua1
      - c2_cua2
      - c2_cba1
      - c2_cba2
    speak: 'Each buys that reach with a measurement: something you can simply count, utilities that build into QALYs, or a price in kroner for every single consequence.'
  - draw:
      - rl3
      - c3_cea1
      - c3_cea2
      - c3_cua1
      - c3_cua2
      - c3_cba1
      - c3_cba2
    speak: 'So each supports a different decision: the best buy inside one disease, any health gain against any other, or whether the thing is worth doing at all.'
  - pause: 0.5
  - draw:
      - rl4
      - c4_cea1
      - c4_cea2
    speak: Take nusinersen. In the CEA column the answer is kroner per motor milestone gained — clinically precise, and useless the moment you leave spinal muscular atrophy.
  - draw:
      - c4_cua1
      - c4_cua2
    speak: In the CUA column it collapses to one number — illustratively, something like seven and a half million kroner per QALY.
  - draw:
      - cmp1
      - cmp2
    speak: 'And now the contrast case can stand beside it: a hip replacement buys a QALY for roughly sixty thousand kroner.'
  - draw:
      - mark_icer
    speak: Only this column lets those two numbers sit on the same page — over a hundred times more health per krone, bought by the boring operation nobody writes about.
    delivery: grave
  - focus:
      target:
        - h_cua
        - c1_cua1
        - c1_cua2
        - c2_cua1
        - c2_cua2
        - c3_cua1
        - c3_cua2
        - c4_cua1
        - c4_cua2
        - mark_icer
    speak: 'That comparability is CUA''s real strength — and its blind spot: it is deaf to anything that is not health, to dignity, to waiting time, to the school the same krone could have built.'
  - draw:
      - c4_cba1
      - c4_cba2
    speak: Cost-benefit hears all of that, and pays for it by having to put a money value on the health gain itself — which is exactly where its legitimacy gets thin, and where the next lecture starts.
  - pause: 0.4
  - clear:
      keep:
        - title
  - draw:
      - k_cea
      - k_cua
      - k_cba
    parallel: true
    speak: 'One line each: CEA finds the best buy inside one problem, CUA puts every health gain in one unit, CBA puts health up against everything else.'
  - draw:
      - k_syn
      - mark_syn
    speak: Each step widens what you can compare — and raises what you must be willing to value.
    delivery: grave
level: basic
