      color: '#b5482e'
  - id: lbl_dc
    type: label
    text: ΔC = kr 20 million
    attach_to: a_dc
    side: above
    style:
      color: '#b5482e'
  - id: a_de
    type: arrow
    from:
      ref: care0
    to:
      ref: drug1
    style:
      color: '#2f6b8f'
  - id: lbl_de
    type: label
    text: ΔE = 4 QALYs
    attach_to: a_de
    side: below
    style:
      color: '#2f6b8f'
  - id: lbl_icer
    type: label
    text: ICER = ΔC / ΔE ≈ kr 5 m per QALY
    attach_to: drug1
    side: right
  - id: ann_icer
    type: annotation
    target: lbl_icer
    kind: box
  - id: lbl_use
    type: label
    text: Shows where money already goes
    attach_to: burden
    side: right
    style:
      color: '#87a878'
  - id: lbl_misuse
    type: label
    text: Big burden ≠ big opportunity
    attach_to: burden
    side: left
    style:
      color: '#b5482e'
  - id: lbl_verdict
    type: label
    text: Describes a problem. Ranks nothing.
    attach_to: burden
    side: above
  - id: ann_verdict
    type: annotation
    target: lbl_verdict
    kind: box
commands:
  - draw:
      - direct
    speak: 'Now that we have seen cost-minimisation hide an assumption, let''s count something else entirely: what spinal muscular atrophy costs Norway in a year, starting with hospital care and the drugs themselves — four hundred million kroner.'
  - draw:
      - prod
      - care
    parallel: true
    speak: 'Then the production lost by patients and by parents who cut their hours, and the unpaid care given at home: a hundred and fifty million, and two hundred and fifty.'
  - pause: 0.3
  - draw:
      - burden
      - e_direct
      - e_prod
      - e_care
    speak: Add them up and you have the headline — eight hundred million kroner a year; my figures are illustrative, but the shape of this study is exactly real.
  - pause: 0.5
  - draw:
      - q_label
    speak: 'And here is the question this figure cannot answer: compared with what?'
  - focus:
      target:
        - burden
    speak: There is no second world here — no alternative Norway, doing something else — so nothing on this canvas is a difference, and without a difference there is no ΔC, no ΔE, and nothing to divide.
    delivery: grave
  - clear: {}
    speak: Set the burden aside and look at the shape every economic evaluation actually has.
  - draw:
      - care0
    speak: 'One world: a child with spinal muscular atrophy on current care, with cost C-zero and health E-zero.'
  - draw:
      - drug1
    speak: 'A second world: the same child on nusinersen, with cost C-one and health E-one.'
  - pause: 0.3
  - draw:
      - a_dc
      - lbl_dc
    speak: Subtract on the cost side, and the extra spending appears — roughly twenty million kroner more over that child's lifetime.
  - draw:
      - a_de
      - lbl_de
    speak: Subtract on the health side, and say four extra quality-adjusted life years appear.
  - draw:
      - lbl_icer
      - ann_icer
    speak: Divide one by the other and you get an ICER, around five million kroner per QALY — a number Beslutningsforum can argue about, because it is a comparison.
  - clear: {}
    speak: So why does that eight-hundred-million figure keep turning up in arguments about whether to buy the drug?
  - show:
      - burden
    speak: Because a big number persuades, and burden studies are usually commissioned by exactly those who want attention for the disease.
  - draw:
      - lbl_use
    speak: 'They do one job genuinely well: they show where money and carers'' hours already go, which helps plan services and reveals a condition nobody has been counting.'
  - show:
      - prod
      - care
      - e_prod
      - e_care
    speak: But the totals inflate easily — value a parent's lost wages here, then the same hours again as unpaid care, and you have counted them twice.
  - draw:
      - lbl_misuse
    speak: 'And a large burden is not an opportunity: a disease can cost a fortune and still have nothing effective available to buy.'
  - pause: 0.4
  - draw:
      - lbl_verdict
      - ann_verdict
    speak: Cost-of-illness measures the size of a problem; only a comparison of two worlds can tell you what to do about it.
    delivery: grave
level: basic
---
title: Picking the right tool
voice: male
template: decision_tree
params:
  root:
    id: q
    type: decision
    label: What must compete?
    children:
      - label: One fixed goal
        node:
          id: cea
          type: terminal
          label: Cost per case detected
      - label: All options compete
        node:
          id: cua
          type: terminal
          label: Cost per QALY
      - label: Benefit leaves health
        node:
          id: cba
          type: terminal
          label: Costs and benefits in kroner
      - label: Nothing compared
        node:
          id: coi
          type: terminal
          label: Cost of illness
elements:
  - id: strike_coi
    type: annotation
    target: label_coi
    kind: strike
  - id: box_q
    type: annotation
    target: label_q
    kind: box
commands:
  - draw:
      - node_q
      - label_q
    speak: Now that we have seen a cost-of-illness study name a burden without ever comparing two options, the method you should have used was settled long before the costing began — at this square.
  - pause: 0.3
  - draw:
      - edge_q_cea
      - branchlabel_q_cea
      - node_cea
      - label_cea
    speak: 'First branch: the objective is fixed and single — find latent tuberculosis among new arrivals — and every option you weigh produces that one thing and nothing else.'
  - highlight:
      target:
        - node_cea
        - label_cea
      effect: glow
    speak: 'Then the honest denominator is the natural unit: kr 12 000 per case detected by one strategy against kr 30 000 by another, with no utility weights in sight.'
  - point:
      at:
        ref: label_cea
      gesture: underline
    speak: 'But the number comes with a fence around it: cost per infection avoided cannot be laid beside cost per hip replaced, so it ranks options only inside its own programme.'
  - pause: 0.4
  - draw:
      - edge_q_cua
      - branchlabel_q_cua
      - node_cua
      - label_cua
    speak: 'Second branch: the options do different kinds of good and reach into the same budget — so they need a common currency, and that currency is the QALY.'
  - highlight:
      target:
        - node_cua
        - label_cua
      effect: glow
    speak: Nusinersen came in at millions of kroner per QALY; a hip replacement buys one for a small fraction of that — only cost per QALY puts them on the same page for Beslutningsforum.
  - focus:
      target:
        - node_cua
        - label_cua
    speak: The price of that reach is compression — everything a treatment does squeezed into one utility number — which is exactly why the QALY's fairness stays contested.
  - pause: 0.3
  - draw:
      - edge_q_cba
      - branchlabel_q_cba
      - node_cba
      - label_cba
    speak: 'Third branch: when the benefit leaves health altogether — time saved, a cleaner river — only cost-benefit analysis can hold it, because it prices the benefit in kroner too.'
  - draw:
      - edge_q_coi
      - branchlabel_q_coi
      - node_coi
      - label_coi
    speak: 'And the fourth branch is not really a branch: cost-of-illness compares nothing with nothing.'
  - draw:
      - strike_coi
    speak: It ranks problems by size, which is why a big burden number travels so well in a press release — but it can never show that spending here buys more health than spending there.
  - highlight:
      target:
        - node_q
      effect: pulse
    speak: 'Cost-minimisation fails the same way one level up: it crowns the cheaper option by assuming DeltaE is zero rather than demonstrating it.'
  - pause: 0.4
  - focus:
      target:
        - node_cea
        - label_cea
        - node_cua
        - label_cua
    speak: 'So the choice is never about which method is most sophisticated — it is about how wide the comparison must be: one programme, or the whole budget.'
  - draw:
      - box_q
    speak: What must compete with what chooses the method, before a single cost is collected.
    delivery: grave
  - speak: 'Four questions, four answers: natural units when the goal is fixed, QALYs when everything competes for the same krone, kroner when the benefit leaves health — and cost-of-illness, which answers none of them, because it never names an alternative.'
level: basic
