playlist:
  title: CEA, CUA, CBA - and why cost-of-illness answers a different question entirely
---
title: Same Drug, Four Questions
voice: male
elements:
  - id: q_top
    type: text
    text: Which should the health system buy?
    x: 500
    'y': 655
    font_size: 30
  - id: n_head
    type: text
    text: Nusinersen for SMA
    x: 250
    'y': 555
    font_size: 27
    style:
      color: '#b5482e'
  - id: n_c
    type: text
    text: ΔC ≈ 5 000 000 kr
    x: 250
    'y': 495
    font_size: 24
  - id: n_e
    type: text
    text: ΔE ≈ 1.5 QALYs
    x: 250
    'y': 450
    font_size: 24
  - id: s_head
    type: text
    text: Statins for prevention
    x: 690
    'y': 555
    font_size: 27
    style:
      color: '#2f6b8f'
  - id: s_c
    type: text
    text: ΔC ≈ 1 500 kr
    x: 690
    'y': 495
    font_size: 24
  - id: s_e
    type: text
    text: ΔE ≈ 0.05 QALYs
    x: 690
    'y': 450
    font_size: 24
  - id: decision
    type: node
    shape: rect
    text: Nusinersen or statins?
  - id: q_cea
    type: node
    shape: rect
    text: 'CEA: cost per natural unit'
  - id: q_cua
    type: node
    shape: rect
    text: 'CUA: cost per QALY'
  - id: q_cba
    type: node
    shape: rect
    text: 'CBA: benefit minus cost, in kroner'
  - id: q_coi
    type: node
    shape: rect
    text: 'COI: what the illness costs us'
    style:
      color: '#b5482e'
  - id: e_cea
    type: edge
    from:
      ref: decision
    to:
      ref: q_cea
  - id: e_cua
    type: edge
    from:
      ref: decision
    to:
      ref: q_cua
  - id: e_cba
    type: edge
    from:
      ref: decision
    to:
      ref: q_cba
  - id: e_coi
    type: edge
    from:
      ref: decision
    to:
      ref: q_coi
    style:
      color: '#b5482e'
  - id: lab_cea
    type: label
    text: milestones vs heart attacks
    attach_to: q_cea
    side: above
  - id: lab_cua
    type: label
    text: 3.3 mill. vs 30 000 kr per QALY
    attach_to: q_cua
    side: below
  - id: mark_coi
    type: annotation
    target: q_coi
    kind: cross
  - id: mark_cua
    type: annotation
    target: q_cua
    kind: box
commands:
  - draw:
      - q_top
    speak: This series is about four different ways of asking whether a health technology is worth buying — pick the wrong one and the numbers you produce cannot answer the question you were asked.
  - draw:
      - n_head
      - n_c
      - n_e
    speak: 'Take nusinersen for spinal muscular atrophy: with illustrative numbers, about five million kroner extra per patient, buying roughly one and a half quality-adjusted life years.'
  - pause: 0.3
  - draw:
      - s_head
      - s_c
      - s_e
    speak: 'And the unglamorous comparison: statins in primary prevention, some fifteen hundred kroner per patient, buying about five hundredths of a QALY.'
  - highlight:
      target:
        - n_c
        - n_e
        - s_c
        - s_e
      effect: glow
    speak: Both are real interventions with real effects, and so far these four numbers tell you nothing about which one the system should buy.
  - pause: 0.5
  - clear: {}
    speak: Because the answer depends entirely on which question you put to them.
  - draw:
      - decision
    speak: Here is the choice — and here are the four questions an economist can ask about it.
  - draw:
      - e_cea
      - q_cea
      - lab_cea
    speak: 'First, cost-effectiveness analysis proper: cost per natural unit of health — kroner per motor milestone gained, kroner per heart attack avoided.'
  - focus:
      target:
        - q_cea
        - lab_cea
    speak: It needs only an outcome you can count, which makes it transparent and hard to argue with — but milestones and heart attacks share no scale, so it can never rank these two against each other.
  - draw:
      - e_cua
      - q_cua
      - lab_cua
    speak: 'Second, cost-utility analysis, which converts every effect into QALYs: three point three million kroner per QALY for nusinersen, about thirty thousand for the statin.'
  - highlight:
      target:
        - lab_cua
      effect: glow
    speak: On that single scale the boring intervention buys over a hundred times more health per krone — the comparison a health system actually needs.
  - point:
      at:
        ref: q_cua
      gesture: circle
    speak: 'Its strength is exactly that: everything becomes comparable. Its weakness is that it assumes a QALY counts the same whoever receives it — which is why Norway bolts alvorlighet, severity, on top of it.'
  - pause: 0.4
  - draw:
      - e_cba
      - q_cba
    speak: Third, cost-benefit analysis, which puts the health gain itself into kroner, so health can be weighed against roads and schools — at the price of having to name what a life year is worth in money.
  - draw:
      - e_coi
      - q_coi
    speak: 'And fourth, the odd one out: a cost-of-illness study, adding up what spinal muscular atrophy costs Norway each year in treatment, care and lost work.'
  - draw:
      - mark_coi
    speak: There is no alternative inside it, no comparison, no decision — it measures a burden, and it can rank nothing at all.
    delivery: grave
  - speak: Yet it is the figure that reaches ministries and newspapers, quoted as if a large burden by itself proved a treatment worth funding.
  - draw:
      - mark_cua
    speak: Four questions, four answers — and only this one can rank a rare drug against a common one. The method you pick decides what you are even allowed to conclude.
level: basic
