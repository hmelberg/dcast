playlist:
  title: Which uncertainties can more money actually fix?
---
title: Four Unknowns, One Decision
voice: male
elements:
  - id: title
    type: text
    text: Nusinersen for SMA — the appraisal sheet
    x: 500
    'y': 700
    font_size: 30
  - id: icer_line
    type: text
    text: ICER = ΔC / ΔE
    x: 500
    'y': 560
    font_size: 30
  - id: icer_num
    type: text
    text: millions of kroner per QALY gained
    x: 500
    'y': 495
    font_size: 26
    style:
      color: '#b5482e'
  - id: lambda_line
    type: text
    text: λ, severity-weighted ≈ 825 000 kr per QALY
    x: 500
    'y': 420
    font_size: 26
    style:
      color: '#2f6b8f'
  - id: verdict_line
    type: text
    text: 'Beslutningsforum: no (2017) → yes (2018), with an age limit'
    x: 500
    'y': 330
    font_size: 24
  - id: one_number
    type: text
    text: One number. Four different unknowns behind it.
    x: 500
    'y': 230
    font_size: 26
    style:
      color: '#b5482e'
  - id: box1
    type: shape
    shape: rect
    x: 100
    'y': 480
    width: 380
    height: 130
    style:
      color: '#8f887c'
  - id: b1_h
    type: text
    text: 1. A survival hazard
    x: 290
    'y': 580
    font_size: 23
  - id: b1_d
    type: text
    text: Estimated from ~120 infants
    x: 290
    'y': 545
    font_size: 19
  - id: b1_d2
    type: text
    text: followed for roughly a year
    x: 290
    'y': 515
    font_size: 19
  - id: box2
    type: shape
    shape: rect
    x: 520
    'y': 480
    width: 380
    height: 130
    style:
      color: '#8f887c'
  - id: b2_h
    type: text
    text: 2. The model's shape
    x: 710
    'y': 580
    font_size: 23
  - id: b2_d
    type: text
    text: Three motor states, or five?
    x: 710
    'y': 545
    font_size: 19
  - id: b2_d2
    type: text
    text: Can a gained milestone be lost?
    x: 710
    'y': 515
    font_size: 19
  - id: box3
    type: shape
    shape: rect
    x: 100
    'y': 300
    width: 380
    height: 130
    style:
      color: '#8f887c'
  - id: b3_h
    type: text
    text: 3. Who the patient is
    x: 290
    'y': 400
    font_size: 23
  - id: b3_d
    type: text
    text: A 3-month-old with type 1, or
    x: 290
    'y': 365
    font_size: 19
  - id: b3_d2
    type: text
    text: a 14-year-old with type 2?
    x: 290
    'y': 335
    font_size: 19
  - id: box4
    type: shape
    shape: rect
    x: 520
    'y': 300
    width: 380
    height: 130
    style:
      color: '#8f887c'
  - id: b4_h
    type: text
    text: 4. The discount rate
    x: 710
    'y': 400
    font_size: 23
  - id: b4_d
    type: text
    text: r = 4% a year, by guideline
    x: 710
    'y': 365
    font_size: 19
  - id: b4_d2
    type: text
    text: compounded over 60 years
    x: 710
    'y': 335
    font_size: 19
  - id: note1
    type: text
    text: The age limit answered row 3,
    x: 290
    'y': 245
    font_size: 18
    style:
      color: '#8f887c'
  - id: note2
    type: text
    text: not row 1.
    x: 290
    'y': 220
    font_size: 18
    style:
      color: '#8f887c'
