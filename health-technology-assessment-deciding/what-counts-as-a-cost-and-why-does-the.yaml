title: Does Lost Production Count?
voice: female
domain:
  x:
    - 0
    - 20
  'y':
    - 0
    - 700
elements:
  - id: ax
    type: axes
    x_label: Years after leaving work
    y_label: Lost output (1000 kr per year)
  - id: zero_line
    type: curve
    expr: '0'
    style:
      color: '#8f887c'
      dash: true
      opacity: 0.35
  - id: hc_curve
    type: curve
    expr: 650*exp(-0.0392*x)
    style:
      color: '#b5482e'
  - id: label_hc
    type: label
    text: Her yearly output, discounted
    attach_to: hc_curve
    side: above
    style:
      color: '#b5482e'
  - id: hc_region
    type: region
    between:
      - hc_curve
      - zero_line
    x_from: 0
    x_to: 20
    style:
      fill: '#c96567'
      opacity: 0.22
  - id: label_hc_total
    type: label
    text: Human capital ≈ 8.8 mill. kr
    attach_to: hc_region
    side: below-right
    style:
      color: '#b5482e'
  - id: friction_line
    type: arrow
    from:
      x: 0.25
      'y': 0
    to:
      x: 0.25
      'y': 690
    style:
      color: '#2f6b8f'
      dash: true
  - id: friction_region
    type: region
    between:
      - hc_curve
      - zero_line
    x_from: 0
    x_to: 0.25
    style:
      fill: '#2f6b8f'
      opacity: 0.55
  - id: label_friction
    type: label
    text: 'Friction period: 3 months'
    attach_to: friction_line
    side: above-right
    style:
      color: '#2f6b8f'
  - id: label_friction_total
    type: label
    text: Friction cost ≈ 160 000 kr
    attach_to: friction_region
    side: right
    style:
      color: '#2f6b8f'
  - id: n_child
    type: node
    shape: person
    text: Child with SMA
  - id: n_parent
    type: node
    shape: person
    text: Parent
  - id: n_loss
    type: node
    shape: rect
    text: Production loss
  - id: e1
    type: edge
    from:
      ref: n_child
    to:
      ref: n_parent
  - id: label_e1
    type: label
    text: Care at home
    attach_to: e1
    side: above
  - id: e2
    type: edge
    from:
      ref: n_parent
    to:
      ref: n_loss
  - id: label_e2
    type: label
    text: Leaves or cuts paid work
    attach_to: e2
    side: above
  - id: mark_loss
    type: annotation
    target: n_loss
    kind: box
commands:
  - draw:
      - ax
      - zero_line
    speak: 'Now that we have seen a procedure''s price built up bottom-up or read off the DRG average, we turn to a cost that appears in no hospital ledger at all: the work the patient stops doing.'
  - draw:
      - hc_curve
      - label_hc
    speak: Our patient is a 45-year-old machine operator who leaves the labour force after a stroke, twenty years before retirement, on 650 000 kroner a year — this line is the output she no longer produces, discounted at four per cent.
  - draw:
      - hc_region
      - label_hc_total
    speak: 'The human capital approach counts the whole shaded block: every remaining working year, about 8.8 million kroner in present value.'
  - pause: 0.4
  - highlight:
      target:
        - hc_region
      effect: glow
    speak: On this accounting one stroke costs society an entire career, which quietly assumes her chair stays empty until 2045.
  - draw:
      - friction_line
      - label_friction
    speak: 'The friction cost approach asks a narrower question: how long is the chair actually empty?'
  - draw:
      - friction_region
    speak: With people looking for work, the post is advertised, filled and trained in roughly three months — so the loss is only this sliver at the left edge.
  - camera:
      center:
        ref: friction_region
      zoom: 5
  - draw:
      - label_friction_total
    speak: 'Close up, the sliver has a value: about 160 000 kroner, recruitment and training included.'
  - camera:
      reset: true
    speak: 'Same patient, same stroke: 8.8 million, or 160 000 — a factor of fifty, settled by a modelling convention rather than by anything that happened to her.'
  - pause: 0.4
  - highlight:
      target:
        - friction_region
      effect: pulse
    speak: The sliver's logic comes from Rotterdam in the mid-nineties, where Koopmanschap and colleagues argued that if unemployed workers exist, production returns once the vacancy is filled — so society loses the transition, not the career.
  - point:
      at:
        ref: hc_region
      gesture: underline
    speak: Human capital assumes nobody ever takes her place; friction assumes someone always can — neither is true everywhere, so the method is chosen, not derived.
  - highlight:
      target:
        - label_hc_total
      effect: glow
    speak: 'And human capital carries an uncomfortable corollary: it makes the identical stroke cheap in a pensioner and expensive in a lawyer.'
  - clear: {}
    speak: Norwegian guidance therefore keeps production changes out of the base-case ICER and asks for them separately, so a decision never hinges on the patient's payslip.
  - draw:
      - n_child
    speak: 'Now put our running case in the same frame: an infant with spinal muscular atrophy, who earns nothing and will not for two decades.'
  - draw:
      - e1
      - label_e1
      - n_parent
    speak: So the patient's own production loss is zero under either method — yet the loss is real, and it sits one household member away.
  - draw:
      - e2
      - label_e2
      - n_loss
    speak: A parent drops to part time, or leaves work entirely, to provide care at home; that is where the production loss in the SMA case actually lands.
  - draw:
      - mark_loss
    speak: Count that box and nusinersen looks better, because a treated child means a parent back at work; leave it out and the same drug looks worse — nothing about the child changed.
  - speak: 'Lost production is not a measurement but an assumption about what society is short of, workers or time: so state the method, state whose earnings you counted, and show the ICER both ways.'
    delivery: grave
level: basic
---
title: The Costs Nobody Books
voice: female
template: tornado_diagram
params:
  title: Which omission moves the ratio?
  x_label: ICER (million kr per QALY)
  base: 3.5
  show_values: true
  bars:
    - label: Informal care
      low: 2.75
      high: 3.5
    - label: Unrelated future costs
      low: 3.5
      high: 3.9
    - label: Production loss
      low: 3.2
      high: 3.5
    - label: Cost of the assessment
      low: 3.49
      high: 3.51
elements:
  - id: mark_informal
    type: annotation
    target: bar_label_0
    kind: box
commands:
  - draw:
      - axes
      - base_line
    speak: 'Now that we have seen what four percent a year does to a child''s future health, one question is left: which costs never got booked at all.'
  - highlight:
      target:
        - base_line
      effect: glow
    speak: Our nusinersen base case sits on this line — an illustrative three and a half million kroner per QALY, counting only what the guideline asks us to count.
  - pause: 0.3
  - draw:
      - bar_label_0
      - bar_0
    speak: Parents of an untreated child with spinal muscular atrophy hand over hours that no invoice records; book that informal care and the comparator arm gets dearer, so DeltaC shrinks and the ratio falls toward two and three quarter million.
  - pause: 0.4
  - draw:
      - bar_label_1
      - bar_1
    speak: The treated child also lives longer, and those added years contain hip replacements, pneumonias, everything unrelated to the disease; book those unrelated future medical costs and the ratio climbs the other way.
  - highlight:
      target:
        - bar_0
        - bar_1
      effect: glow
    speak: The two biggest omissions point in opposite directions, because one lands in the comparator arm and the other in the treated one.
    delivery: grave
  - pause: 0.3
  - draw:
      - bar_label_2
      - bar_2
    speak: Lost production, the argument of part three, belongs here to the parents rather than the patient, and shifts the ratio less than their care hours do.
  - draw:
      - bar_label_3
      - bar_3
    speak: And the cost of the assessment itself — the analysts, the submissions, the Beslutningsforum agenda item.
  - camera:
      center:
        ref: bar_3
      zoom: 2.5
    speak: It is the thin one.
    delivery: soft
  - camera:
      reset: true
    speak: Worth knowing once for the system's own accounts, and worth almost nothing inside this ratio.
  - focus:
      target:
        - bar_0
        - bar_1
    speak: 'So the rule is not count everything: an omission moves the ratio only when it falls unevenly on the two arms.'
  - highlight:
      target:
        - base_line
      effect: pulse
    speak: A cost both arms carry alike — the same GP visits, the same travel — cancels inside DeltaC whether you write it down or not.
  - point:
      at:
        ref: bar_0
      gesture: underline
    speak: For the boring comparator — a hip replacement at a few hundred thousand kroner per QALY — that same informal-care column is a large share of a small DeltaC, so leaving it out can reorder the whole list.
  - pause: 0.4
  - clear:
      keep:
        - axes
        - base_line
        - bar_0
        - bar_label_0
        - bar_1
        - bar_label_1
    speak: Strip out what cannot move it, and two columns are left.
  - draw:
      - mark_informal
    speak: Informal care is the larger of them, and the one a Norwegian base case most often leaves off the sheet — which is exactly why it belongs in its own visible row.
  - draw:
      - title
    speak: 'Across all five parts: a cost is the ressursbruk — the resource use — that something else could have had, micro-costed or DRG-averaged, discounted at four percent, and booked even when nobody sends an invoice; what decides the ratio is never the price tag, but the difference between two arms.'
level: basic
