playlist:
  title: What counts as a cost, and why does the future cost less?
---
title: The Price Tag Is Not the Cost
voice: female
elements:
  - id: t_title
    type: text
    text: The price tag is not the cost
    x: 500
    'y': 690
    font_size: 32
  - id: tag
    type: shape
    shape: rect
    x: 500
    'y': 460
    width: 460
    height: 120
  - id: tag_price
    type: text
    text: kr 700 000
    x: 500
    'y': 490
    font_size: 44
    style:
      color: '#b5482e'
  - id: tag_sub
    type: text
    text: one dose of nusinersen (list price)
    x: 500
    'y': 435
    font_size: 22
  - id: regimen
    type: text
    text: 6 doses in year 1, then 3 a year  ≈  kr 4 mill. per year
    x: 500
    'y': 345
    font_size: 24
  - id: dc_line
    type: text
    text: ΔC = C₁ − C₀
    x: 500
    'y': 240
    font_size: 36
  - id: dc_note
    type: text
    text: spent with the drug  −  spent without it
    x: 500
    'y': 190
    font_size: 22
    style:
      color: '#8f887c'
  - id: led_title
    type: text
    text: One child, one year — the ΔC ledger (kr)
    x: 500
    'y': 690
    font_size: 28
  - id: r1a
    type: text
    text: Drug acquisition
    x: 330
    'y': 600
    font_size: 24
  - id: r1b
    type: text
    text: + 4 200 000
    x: 770
    'y': 600
    font_size: 24
    style:
      color: '#b5482e'
  - id: r2a
    type: text
    text: 'Injection: theatre, sedation, imaging'
    x: 330
    'y': 530
    font_size: 22
  - id: r2b
    type: text
    text: + 150 000
    x: 770
    'y': 530
    font_size: 24
    style:
      color: '#b5482e'
  - id: r3a
    type: text
    text: 'Monitoring: motor tests, labs, visits'
    x: 330
    'y': 460
    font_size: 22
  - id: r3b
    type: text
    text: + 80 000
    x: 770
    'y': 460
    font_size: 24
    style:
      color: '#b5482e'
  - id: r4a
    type: text
    text: Ventilation and ICU avoided
    x: 330
    'y': 390
    font_size: 22
  - id: r4b
    type: text
    text: − 300 000
    x: 770
    'y': 390
    font_size: 24
    style:
      color: '#2f6b8f'
  - id: r5a
    type: text
    text: Informal care by the family
    x: 330
    'y': 320
    font_size: 22
  - id: r5b
    type: text
    text: + ?
    x: 770
    'y': 320
    font_size: 24
    style:
      color: '#8a5fa8'
  - id: r6a
    type: text
    text: Future unrelated health care
    x: 330
    'y': 250
    font_size: 22
  - id: r6b
    type: text
    text: + ?
    x: 770
    'y': 250
    font_size: 24
    style:
      color: '#8a5fa8'
  - id: rule
    type: path
    points:
      - - 170
        - 210
      - - 830
        - 210
    style:
      color: '#8f887c'
  - id: led_total
    type: text
    text: ΔC ≈ 4 130 000  +  two question marks
    x: 500
    'y': 160
    font_size: 28
  - id: mark_total
    type: annotation
    target: led_total
    kind: box
  - id: q_title
    type: text
    text: Four questions in this series
    x: 500
    'y': 690
    font_size: 30
  - id: q1
    type: text
    text: 1.  Where do unit costs come from?
    x: 500
    'y': 570
    font_size: 26
  - id: q2
    type: text
    text: 2.  Should lost production count?
    x: 500
    'y': 480
    font_size: 26
  - id: q3
    type: text
    text: 3.  Why does the future cost less?
    x: 500
    'y': 390
    font_size: 26
  - id: q4
    type: text
    text: 4.  Which costs never get booked?
    x: 500
    'y': 300
    font_size: 26
    style:
      color: '#8a5fa8'
  - id: closing
    type: text
    text: A price is one line. ΔC is the whole page.
    x: 500
    'y': 170
    font_size: 26
  - id: mark_closing
    type: annotation
    target: closing
    kind: box
commands:
  - draw:
      - t_title
      - tag
    speak: A committee that argues about a price tag is arguing about the wrong number — so this series takes one price apart into everything a decision must actually pay for, and then asks why a krone spent in the future counts for less than one spent today.
  - draw:
      - tag_price
      - tag_sub
      - regimen
    speak: 'Nusinersen for spinal muscular atrophy: around seven hundred thousand kroner a dose at list price, six doses in the first year and three a year after — roughly four million kroner, annually, per child.'
  - point:
      at:
        ref: tag_price
      gesture: circle
    speak: That is the number that made the newspapers, and the number Beslutningsforum was accused of hiding behind. It is not the number the analysis uses.
  - pause: 0.4
  - draw:
      - dc_line
      - dc_note
    speak: 'The analysis needs delta C: the difference in ressursbruk — resource use — between the new technology and current care.'
  - pause: 0.5
  - clear: {}
  - draw:
      - led_title
    speak: So open the ledger, for one child, for one year.
  - draw:
      - r1a
      - r1b
    speak: 'Line one, the drug itself: six doses at seven hundred thousand, four point two million kroner.'
  - draw:
      - r2a
      - r2b
      - r3a
      - r3b
    speak: It does not administer itself — each dose goes into the spinal fluid, in theatre, under sedation — and the treatment obliges motor testing, blood work and clinic visits.
  - pause: 0.3
  - highlight:
      target:
        - r4a
        - r4b
      effect: glow
    speak: Then a line that points the other way.
  - draw:
      - r4a
      - r4b
    speak: Ventilator hours and intensive care this child no longer needs are subtracted, because delta C is a difference, not a bill — a treatment can buy back some of its own price.
  - pause: 0.3
  - draw:
      - r5a
      - r5b
      - r6a
      - r6b
    speak: 'And two lines nobody invoices: the parents'' hours of care, and the health care a longer life will use for things entirely unrelated to this disease.'
  - draw:
      - rule
      - led_total
    speak: Four point one million kroner in year one — plus two question marks we never priced.
  - draw:
      - mark_total
    speak: The headline price was one line of this page.
    delivery: grave
  - pause: 0.5
  - clear: {}
  - draw:
      - q_title
      - q1
    speak: Four questions follow. Where does a unit cost even come from — micro-costing every minute and syringe, or the DRG average the funding system already pays per hospital stay?
  - draw:
      - q2
    speak: When a parent leaves work, does that lost production belong in delta C — and does human capital or friction cost describe what society actually loses?
  - draw:
      - q3
    speak: Norway discounts costs and health effects at four percent a year, which halves a QALY arriving eighteen years from now — and a child's benefits arrive decades away.
  - draw:
      - q4
    speak: 'And which costs never get booked at all: informal care, unrelated future treatment, and the assessment itself, which is also not free.'
  - draw:
      - closing
      - mark_closing
    speak: A price is one line; delta C is the whole page — and the page is dated.
level: basic
