commands:
  - draw:
      - t_title
    speak: Now that we have seen that a price tag is not a cost, someone has to put a number on one procedure — and the two available routes can disagree by a factor of two.
  - draw:
      - r1_item
      - r1_cost
      - r2_item
      - r2_cost
    speak: 'The bottom-up route, micro-costing, counts ingredients: a neurologist for the forty-five minute lumbar puncture, two nurses for the hour.'
  - draw:
      - r3_item
      - r3_cost
      - r4_item
      - r4_cost
    speak: An hour of staffed, sterile procedure room is the biggest line, two thousand four hundred; the tray, drapes and ultrasound gel add seven hundred.
  - draw:
      - r5_item
      - r5_cost
    speak: Then four hours of observation, because a child who has had nusinersen injected into the spine does not go straight home.
  - draw:
      - rule
      - total_item
      - total_cost
    speak: Six thousand five hundred kroner to deliver one dose — the price of the vial itself is a separate, and confidential, conversation.
  - pause: 0.4
  - highlight:
      target:
        - total_cost
      effect: glow
    speak: Every row is a quantity times a unit price, so a reviewer can argue with any single line, and you can re-cost the whole thing when the protocol changes.
  - clear: {}
    speak: The top-down route skips all of that.
  - draw:
      - box_drg
      - drg_title
      - drg_num
    speak: You take the DRG the case is coded to, multiply its weight by the national unit price set each year in the state budget, and read off eleven thousand three hundred kroner.
  - draw:
      - box_micro
      - micro_title
      - micro_num
      - gap_arrow
      - gap_label
    speak: Same patient, same hour, nearly five thousand kroner apart.
  - pause: 0.4
  - draw:
      - note1
      - note2
    speak: The gap is not sloppiness — the DRG system was built at Yale in the nineteen-seventies to pay hospitals per case, so the tariff carries ward overhead and a share of everything else the hospital does.
  - draw:
      - note3
    speak: 'Which makes it a negotiated reimbursement price: an opinion about financing, not a measurement of what this patient consumed.'
  - clear: {}
    speak: So when is the shelf number good enough?
  - draw:
      - ax3
      - baseline
  - draw:
      - cost_curve
    speak: Here is what one administration really costs across everyone coded into that same DRG — the numbers are illustrative, the shape is not.
  - draw:
      - pt_typical
      - lbl_typical
    speak: 'Most sit near the hump: an uncomplicated puncture in a cooperative patient, close to our six and a half thousand.'
  - draw:
      - pt_avg
      - lbl_avg
    speak: The tariff sits further right, pulled there by overhead and by the difficult cases it also has to cover.
  - draw:
      - tail_region
      - lbl_tail
      - pt_sma
      - lbl_sma
    speak: 'And out in the tail is our SMA child with scoliosis and spinal rods: sedation, an anaesthetist, image guidance — around twenty-six thousand every dose.'
  - pause: 0.4
  - draw:
      - mark_sma
    speak: For a hospital's accounts the average is fine; for this child the tariff understates real resource use by more than half — and understates it in the direction that flatters the new technology.
    delivery: grave
  - speak: The average is a fair description of nobody in particular, so micro-cost the few items your decision turns on, take the tariff for the rest, and say which you took where.
level: basic
