commands:
  - draw:
      - cap_units
      - hdr_person
      - hdr_y1
      - hdr_y0
      - rule_top
    speak: 'Now that we have seen what the lottery draws, one question is still open: how do you put a number on a difference that nobody can ever see?'
  - draw:
      - r_ana
      - ana_y1
      - ana_y0
    speak: Ana has coverage, and her health score with it is 0.80 — her score without coverage is a blank we will never fill in.
  - pause: 1
  - draw:
      - r_ben
      - ben_y1
      - ben_y0
      - r_carla
      - carla_y1
      - carla_y0
      - r_dan
      - dan_y1
      - dan_y0
    speak: 'Everyone else is the same story from one side or the other: one number we can see, one future we cannot.'
  - pause: 1
  - draw:
      - hdr_eff
      - eff_ana
      - eff_ben
      - eff_carla
      - eff_dan
    speak: So the column we actually care about — what coverage did for each of them — is question marks all the way down.
  - pause: 1
  - draw:
      - rule_bot
      - avg_lab
      - avg_y1
      - avg_y0
    speak: 'Now stop reading across the rows and read down the columns instead: the scores we can see average 0.76 with insurance and 0.58 without.'
  - draw:
      - gap_arrow
      - gap_label
    speak: Eighteen points — a number we can actually compute, even though not one person's own effect is known.
  - pause: 1
  - highlight:
      target:
        - avg_y1
        - avg_y0
      effect: glow
    speak: An average needs nobody to appear twice; it only needs one group of people to stand in for another group's missing column.
  - pause: 1
  - clear: {}
  - draw:
      - n_pool
    speak: 'Oregon, 2008: the state could afford Medicaid for about ten thousand more adults, and roughly ninety thousand people put their names down.'
  - draw:
      - n_drawn
      - n_not
      - e_drawn
      - e_not
    speak: A lottery split that list — about thirty thousand names drawn, the rest not — decided by chance and nothing else.
  - pause: 1
  - highlight:
      target:
        - n_drawn
        - n_not
      effect: glow
    speak: 'Chance makes the two groups mirror images: same ages, same illnesses, same worries, on average.'
  - draw:
      - lab_drawn
      - lab_not
      - ann_key
    speak: So the people who lost the draw can stand in for the missing column of the people who won it.
  - pause: 1
  - draw:
      - finding
    speak: 'That is why health ministries and insurers pay for lotteries and trials: the drawn group used more care and had clearly less depression, while blood-sugar control barely moved — differences no survey could ever have pinned on insurance alone.'
  - pause: 1
  - clear: {}
  - draw:
      - c_missing
    speak: 'Every design in the rest of this course is an argument about one blank: the future that never happened.'
  - draw:
      - d_lottery
      - a_lottery
    speak: A lottery fills it with the people who were not drawn.
  - draw:
      - d_did
      - a_did
      - d_rd
      - a_rd
    speak: Difference-in-differences fills it with states that did not expand Medicaid; a birthday cut-off fills it with people a few months short of sixty-five.
  - draw:
      - d_sc
      - a_sc
    speak: Synthetic control builds it out of a weighted blend of other states, mixed to match the one we care about.
  - pause: 1
  - draw:
      - ann_final
    speak: One person's effect can never be observed — but an average can, whenever we find an honest stand-in for the future that never happened.
    delivery: grave
