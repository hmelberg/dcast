commands:
  - draw:
      - title
    speak: 'Now that we have seen Maria''s two futures, one question remains: why can no study, however large, ever measure what insurance did to her?'
  - draw:
      - t_box
      - t_hsep
      - t_r1
      - t_r2
      - t_r3
      - t_v1
      - t_v2
      - t_v3
      - t_v4
    parallel: true
  - draw:
      - h_person
      - h_d
      - h_d_sub
    speak: 'One row per person, and a column recording whether she had coverage: D equals one for insured, zero for not.'
  - draw:
      - h_y1
      - h_y1_sub
      - h_y0
      - h_y0_sub
    speak: This column holds her health with insurance — days she felt well, out of thirty — and this one, the very same month lived without coverage.
  - pause: 1
  - draw:
      - r1_name
      - r1_d
      - r1_y1
    speak: Maria won a Medicaid slot in Oregon's lottery, and felt well twenty-four days out of thirty. That number is real; a clerk could look it up.
  - draw:
      - r1_y0
    speak: Her other cell stays a question mark, because nobody can rewind the month and take the insurance back off her.
  - pause: 1
  - draw:
      - h_eff
      - h_eff_sub
    speak: 'And the quantity we actually came for sits in this last column: her health with coverage, minus her health without it.'
  - draw:
      - r1_eff
    speak: Twenty-four minus a question mark is a question mark — Maria's causal effect is not a hard number, it is an unfillable cell.
  - pause: 1
  - draw:
      - r2_name
      - r2_d
      - r2_y1
      - r2_y0
      - r2_eff
    speak: 'James was never drawn: we see nineteen good days uninsured, and the blank has simply jumped to the other column.'
  - draw:
      - r3_name
      - r3_d
      - r3_y1
      - r3_y0
      - r3_eff
      - r4_name
      - r4_d
      - r4_y1
      - r4_y0
      - r4_eff
    speak: 'Rosa, Daniel, and the ninety thousand Oregonians behind them: every new row arrives carrying its own fresh blank, and the last column stays empty all the way down.'
  - pause: 1
  - focus:
      target:
        - r1_y0
        - r2_y1
        - r3_y0
        - r4_y1
    speak: These gaps are not noise — noise shrinks as you collect more data, but a number that was never created stays missing forever.
  - draw:
      - neyman
    speak: Jerzy Neyman first wrote these two columns side by side in nineteen twenty-three, in a paper about yields on agricultural plots.
  - erase:
      - neyman
    speak: Sixty years later Paul Holland gave the gap the name it still carries.
  - draw:
      - note_holland
      - note_box
    speak: 'The fundamental problem of causal inference: for every person, at least one of the two numbers we need is missing — and no sample size, no clever estimator, can conjure it.'
    delivery: grave
  - pause: 1
  - clear:
      keep:
        - title
  - draw:
      - want_node
      - want_cross
    speak: So Oregon, deciding whether to buy ten thousand Medicaid slots, could never ask what coverage did for Maria herself — that question has no answer in any data set on earth.
  - draw:
      - got_node
      - link
      - label_link
    speak: 'What can be answered is a group question: the average health of people who got coverage, against people who did not.'
  - highlight:
      target:
        - got_node
      effect: glow
    speak: Missing data, not statistics — causal inference is the craft of filling one person's blank cell with somebody else's.
