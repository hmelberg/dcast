playlist:
  title: What makes a question causal?
---
title: Her Two Futures
level: basic
voice: female
template: decision_tree
params:
  root:
    id: maria
    type: decision
    label: Maria, age 40
    children:
      - label: Insured (D_i = 1)
        node:
          id: y1
          type: terminal
          label: Y_i(1)
          payoff: 72
      - label: Uninsured (D_i = 0)
        node:
          id: y0
          type: terminal
          label: Y_i(0)
          payoff: 64
elements:
  - id: gap_arrow
    type: arrow
    from:
      ref: payoff_y0
    to:
      ref: payoff_y1
    curved: true
    style:
      color: '#8a5fa8'
  - id: gap_label
    type: label
    text: Effect for Maria = 72 − 64 = 8
    attach_to: gap_arrow
    side: right
    style:
      color: '#8a5fa8'
  - id: cross_y0
    type: annotation
    target: payoff_y0
    kind: cross
  - id: eq_text
    type: text
    x: 500
    'y': 100
    text: Y_i = Y_i(1) if D_i = 1,   Y_i(0) if D_i = 0
    font_size: 26
  - id: punch_text
    type: text
    x: 500
    'y': 52
    text: 'Y_i(1) − Y_i(0): defined for her, never observed'
    font_size: 24
    style:
      color: '#b5482e'
  - id: punch_box
    type: annotation
    target: punch_text
    kind: box
commands:
  - draw:
      - node_maria
      - label_maria
    speak: Governments spend billions on health coverage, and across these four short parts we'll see why proving it helped anyone required a lottery.
  - highlight:
      target:
        - node_maria
      effect: glow
    speak: 'Meet Maria: forty, uninsured, one of about ninety thousand Oregonians who signed up in 2008 when the state had money for only ten thousand more adults.'
  - pause: 1
  - draw:
      - edge_maria_y1
      - branchlabel_maria_y1
      - node_y1
      - label_y1
    speak: 'One road: she gets coverage. D equals one is just a switch — one means insured, zero means not.'
  - draw:
      - payoff_y1
    speak: 'A year later her health scores 72 out of 100. That''s Y of one: her health in the world where she''s covered.'
  - pause: 1
  - draw:
      - edge_maria_y0
      - branchlabel_maria_y0
      - node_y0
      - label_y0
      - payoff_y0
    speak: 'The other road: same woman, same year, no coverage — she''d have scored 64. That''s Y of zero.'
  - pause: 1
  - draw:
      - gap_arrow
      - gap_label
    speak: 'Insurance''s effect on Maria is the gap between those two numbers: eight points.'
  - focus:
      target:
        - payoff_y1
        - payoff_y0
    speak: So "insurance improved her health" compares Maria with Maria — not with her insured neighbour, and not with any average.
  - pause: 1
  - draw:
      - cross_y0
    speak: But the world runs only one road. She enrolled, so 72 sits on the record — and 64 was never measured, by anyone, ever.
  - erase:
      - gap_arrow
      - gap_label
      - edge_maria_y0
      - branchlabel_maria_y0
      - node_y0
      - label_y0
      - payoff_y0
      - cross_y0
    speak: The unlived branch isn't merely unrecorded — it never happens, and the gap we wanted vanishes with it.
    delivery: grave
  - pause: 1
  - draw:
      - eq_text
    speak: 'All the data ever holds is one number per person: whichever future she actually lived.'
  - draw:
      - punch_text
    speak: Her effect stays perfectly well defined — and permanently unobservable.
  - point:
      at:
        ref: punch_text
      gesture: underline
    speak: 'Which is the strange part: the quantity every health policy argument is about has never once been seen for a single patient.'
  - draw:
      - punch_box
    speak: A causal question asks about two futures for one person — and for that person, the answer is never in the data.
  - speak: 'Next: line up thousands of Marias in a table, and watch one column come up always blank.'
    delivery: soft
