commands:
  - draw:
      - title
    speak: Now that we have seen what it takes to carry Oregon's complier effect to another state, one step remains — the one where a committee decides whether to cover the thing at all.
  - draw:
      - eq_lhs
      - eq_num
      - eq_bar
      - eq_den
    speak: 'The incremental cost-effectiveness ratio: the extra cost of covering someone, divided by the extra quality-adjusted life years it buys.'
  - draw:
      - eq_rhs
    speak: Out comes one number in dollars per QALY, and NICE in England, the Nordic agencies and American payers all price coverage from it.
  - highlight:
      target:
        - eq_rhs
      effect: glow
    speak: Only half of that number was ever estimated — and the chosen half moves it further than any confidence interval does.
    delivery: grave
  - wait: click
  - draw:
      - rule_top
      - divider
      - head_left
    speak: So split the formula down the middle — on the left, everything a research design can actually deliver.
  - draw:
      - c1
    speak: 'From the Oregon lottery: enrolling in Medicaid raised annual medical spending by about seven hundred and seventy-eight dollars.'
  - draw:
      - c2
    speak: On the benefit side, the sharpest finding — coverage cut the rate of depression by roughly thirty percent.
  - draw:
      - c3
    speak: 'And the celebrated null: blood pressure, cholesterol and blood sugar barely moved, estimated tightly enough to rule out large effects, not small ones.'
  - draw:
      - c4
    speak: All of it scaled by the quarter of those drawn who actually enrolled, so these are complier effects, not effects on everyone.
  - focus:
      target:
        - head_left
        - c1
        - c2
        - c3
        - c4
    speak: Every line here costs an assumption you agreed to defend — random assignment, exclusion, and the leap from compliers to the population you care about.
  - wait: click
  - draw:
      - head_right
      - v1
    speak: 'Now the other side: to turn less depression into QALYs, somebody has to say what a year without depression is worth.'
  - draw:
      - arrow_weight
      - arrow_label
    speak: That weight comes from a survey — typically EQ-5D valuations, where members of the public trade years of life against health states. No design identifies it.
  - draw:
      - res1
    speak: 'Say that weight is three hundredths of a QALY per year: seven seventy-eight divided by 0.03 is about twenty-six thousand dollars per QALY.'
  - wait: click
  - draw:
      - res2
      - mark_range
    speak: Set the weight to 0.02 and the same causal estimate costs thirty-nine thousand; set it to 0.05 and it costs sixteen thousand.
    delivery: grave
  - highlight:
      target:
        - c2
      effect: glow
    speak: Nothing about Oregon changed — the estimate never moved, only the price we put on feeling well.
  - draw:
      - v2
    speak: 'Then the discount rate: benefits arriving in 2040 count for less than benefits today, and three percent versus one and a half is a stance on the future, not a measurement of it.'
  - draw:
      - v3
    speak: Perspective decides whose dollars count — Medicaid's budget alone, or also the catastrophic out-of-pocket bills Oregon nearly eliminated, and the work that illness costs.
  - draw:
      - v4
    speak: And the threshold that turns a ratio into a yes or no; the American fifty-thousand figure is usually traced back to what dialysis cost Medicare in the seventies, not to any estimate of what health is worth.
  - highlight:
      target:
        - v4
      effect: pulse
    speak: NICE has used twenty to thirty thousand pounds since 1999, while Claxton's team estimated that the health displaced elsewhere in the NHS costs about thirteen thousand — if that is right, approvals at the official threshold destroy more health than they create.
  - wait: click
  - ask:
      intro: One quick check on the figure.
      question: Click the parameter that decides whether $26,000 per QALY counts as good value.
      answer: v4
      widget: click
      right: The threshold does that work — the ratio itself never says yes or no.
      wrong: 'The ratio is only ever compared with something: the threshold converts it into a decision.'
  - quiz:
      intro: And two on the logic.
      question: Which change moves the cost per QALY with no new data at all?
      choices:
        - A larger Oregon sample
        - A lower discount rate
        - A stronger first stage
      correct: 2
      right: The discount rate is chosen, so changing it moves the number without a single new observation.
      wrong: Sample size and first-stage strength change the estimate's precision; they need data.
  - quiz:
      question: The $778 spending effect and the EQ-5D utility weight differ in kind. How?
      choices:
        - Both are causal estimates
        - One is estimated, one is elicited preference
        - Both are value judgements
      correct: 2
      right: The spending effect is identified by the lottery; the weight is elicited from people's stated preferences.
      wrong: Only one of them has a research design behind it — the weight comes from a valuation survey.
  - speak: That's {score} out of {score_total}.
    delivery: brisk
  - draw:
      - closer
    speak: 'So report the ratio as what it is: an estimate defended by one assumption, carried to a new population by another, and then multiplied by four numbers nobody estimated.'
  - speak: 'Across this series the road from design to decision was one chain of things you agree to defend — and you can now see where the chain changes character: at the end, honesty means naming a choice, not an identification strategy.'
    delivery: grave
