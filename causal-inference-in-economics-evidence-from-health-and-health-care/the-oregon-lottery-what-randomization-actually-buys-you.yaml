commands:
  - draw:
      - a_title
    speak: 'Now that we have seen what independence promises, here is the catch: it is a claim about potential outcomes we never observe, so nobody can test it directly.'
  - draw:
      - a_h1
      - a_h2
      - a_h3
      - a_h4
      - a_rule
    parallel: true
    speak: So we test its observable shadow — characteristics fixed before the draw, which winning a lottery could not possibly have changed.
  - draw:
      - a_r1c1
      - a_r1c2
      - a_r1c3
      - a_r1c4
      - a_r2c1
      - a_r2c2
      - a_r2c3
      - a_r2c4
    parallel: true
    speak: 'Oregon''s own audit, across the roughly seventy-five thousand people in the study: about fifty-six percent women on each side, and a mean age near forty-one on each side.'
  - pause: 0.4
  - draw:
      - a_r3c1
      - a_r3c2
      - a_r3c3
      - a_r3c4
      - a_r4c1
      - a_r4c2
      - a_r4c3
      - a_r4c4
    parallel: true
    speak: Language from the sign-up form, and hospital stays pulled from state discharge records before the draw — a measure nobody could report to their own advantage.
  - focus:
      target:
        - a_r1c4
        - a_r2c4
        - a_r3c4
        - a_r4c4
    speak: 'Read down the last column: the gaps are fractions of a percentage point, and they do not all lean the same way.'
  - draw:
      - a_ftest
      - a_mark
    speak: The decisive test is joint — put every covariate together and ask whether they predict who was drawn; in Oregon, they cannot.
  - quiz:
      intro: Quick check.
      question: In a lottery that truly worked, what should twenty separate balance comparisons at the 5% level show?
      choices:
        - All twenty balanced
        - About one significant by chance
        - Any starred row voids the study
      correct: 2
      right: About one in twenty looks significant by pure chance — which is why the joint test, not a single starred row, decides.
      wrong: Randomization removes systematic gaps, not sampling noise.
  - draw:
      - a_hh
    speak: 'One covariate is imbalanced on purpose: the lottery drew individuals but covered everyone on their household application, so larger households were likelier to win — which is why every Oregon regression controls for household size.'
  - clear: {}
  - draw:
      - b_title
      - b_h1
      - b_h2
      - b_h3
      - b_h4
      - b_rule
    speak: Now the counterexample — a table from a lottery that did not work.
  - draw:
      - b_r1c1
      - b_r1c2
      - b_r1c3
      - b_r1c4
    parallel: true
    speak: The first row looks fine, which proves nothing; one balanced characteristic is easy to come by.
  - draw:
      - b_r2c1
      - b_r2c2
      - b_r2c3
      - b_r2c4
      - b_r3c1
      - b_r3c2
      - b_r3c3
      - b_r3c4
      - b_r4c1
      - b_r4c2
      - b_r4c3
      - b_r4c4
    parallel: true
    speak: But the winners are four and a half years younger, half as likely to have been hospitalized before the draw, and far likelier to have signed up on day one.
  - highlight:
      target:
        - b_r2c4
        - b_r3c4
        - b_r4c4
      effect: glow
      color: '#b5482e'
    speak: They all point the same way — toward a healthier, keener group — and each is many times its standard error; that is a pattern, not noise.
  - draw:
      - b_ftest
      - b_mark
    speak: 'The joint test rejects at p below one in a thousand: whatever sorted these two groups, it was not a coin.'
    delivery: grave
  - quiz:
      intro: One more.
      question: A balance table fails like this. What is the most likely explanation?
      choices:
        - The treatment effect is zero
        - Something shaped the groups after the draw
        - Randomization simply failed
      correct: 2
      right: Systematic gaps usually mean the analysed sample was formed after randomization — differential attrition, or a subgroup defined by post-draw behaviour.
      wrong: Balance is about how the two groups were formed, not about the size of any effect.
  - clear: {}
  - draw:
      - c_1
      - c_2
    speak: 'So the audit is narrower than it looks: it never verifies the assumption about unobservables, it only checks that the machinery behaved.'
  - draw:
      - c_3
      - c_4
    speak: That check mattered here, because Oregon in 2008 was the first randomized test of extending Medicaid coverage in about four decades — one shot, and everything downstream rests on it.
  - draw:
      - c_mark
    speak: A balance table cannot prove that winners and losers had the same potential outcomes; it can only fail to catch a lottery that broke — and the joint test is what decides.
    delivery: grave
---
title: What a Lottery Can and Cannot Settle
level: advanced
voice: female
template: icon_array
params:
  total: 100
  groups:
