playlist:
  title: 'The Oregon lottery: what randomization actually buys you'
---
title: 'Independence: (Y(1),Y(0)) ⊥ D'
level: advanced
voice: female
template: equation_steps
params:
  title: What the lottery buys
  steps:
    - tex: Y_i = D_i\,Y_i(1) + (1-D_i)\,Y_i(0)
      note: We see one outcome per person.
    - tex: E[Y_i\mid D_i=1]-E[Y_i\mid D_i=0]=\underbrace{E[Y_i(1)-Y_i(0)\mid D_i=1]}_{\text{ATT}}+\underbrace{E[Y_i(0)\mid D_i=1]-E[Y_i(0)\mid D_i=0]}_{\text{selection bias}}
      note: Lecture 2's decomposition.
    - tex: \bigl(Y_i(1),\,Y_i(0)\bigr)\ \perp\ D_i
      note: What the draw delivers.
    - tex: E[Y_i\mid D_i=1]-E[Y_i\mid D_i=0]=E[Y_i(1)]-E[Y_i(0)]
      note: Selection bias = 0. This is the ATE.
elements:
  - id: mark_ate
    type: annotation
    target: step_3
    kind: box
  - id: n_list
    type: node
    shape: rect
    text: ≈90,000 signed up
  - id: n_draw
    type: node
    shape: chance
    text: Lottery
  - id: n_treat
    type: node
    shape: rect
    text: '≈30,000 drawn: D=1'
    style:
      color: '#2f6b8f'
  - id: n_ctrl
    type: node
    shape: rect
    text: '≈60,000 not drawn: D=0'
    style:
      color: '#b5482e'
  - id: a1
    type: arrow
    from:
      ref: n_list
    to:
      ref: n_draw
  - id: a2
    type: arrow
    from:
      ref: n_draw
    to:
      ref: n_treat
    curved: true
    style:
      color: '#2f6b8f'
  - id: a3
    type: arrow
    from:
      ref: n_draw
    to:
      ref: n_ctrl
    curved: true
    style:
      color: '#b5482e'
  - id: lab_indep
    type: label
    text: Same distribution of Y(1), Y(0) in both arms
    attach_to: n_draw
    side: below
commands:
  - draw:
      - title
      - step_0
      - note_0
    speak: Now that we have seen Oregon draw thirty thousand names, the question is what that draw licenses you to claim — because with any other data, comparing the insured to the uninsured is a mistake, and here it is not.
  - pause: 0.4
  - draw:
      - step_1
      - note_1
    speak: 'From Lecture 2: the raw difference in means is the effect on the treated, plus a term comparing the two groups'' untreated outcome Y_i(0).'
  - highlight:
      target:
        - step_1
      effect: glow
    speak: That second bracket is the whole problem — the people who get insured would have had different health anyway, and no arithmetic on observed data pulls it apart from the effect.
  - draw:
      - step_2
      - note_2
    speak: 'The lottery''s entire contribution is this line: a machine that knows nothing about you assigns D, so treatment is independent of both potential outcomes.'
  - pause: 0.3
  - highlight:
      target:
        - step_2
      effect: glow
    speak: Far stronger than equal average age — the full joint distribution of Y(1) and Y(0) matches across arms, motivation and family support and every trait nobody wrote down included.
  - draw:
      - step_3
      - note_3
    speak: So the untreated outcome has the same expectation in both arms, the bias term is exactly zero, and a difference of raw averages is the average causal effect.
  - draw:
      - mark_ate
    speak: 'No covariates, no functional form: the design is doing the identifying, and the regression is just bookkeeping.'
    delivery: grave
  - quiz:
      intro: A quick check.
      question: In the decomposition, what does independence set to zero?
      choices:
        - The treatment effect itself
        - The selection-bias term
        - The variance of Y
      correct: 2
      right: Independence makes the untreated outcome equal in expectation across arms, so the selection-bias term vanishes.
      wrong: The causal effect survives; it is the comparison of untreated outcomes across the two groups that disappears.
  - clear: {}
    speak: Now, who exactly does that promise cover?
  - draw:
      - n_list
    speak: Roughly ninety thousand low-income uninsured adults signed onto Oregon's waiting list within five weeks.
  - draw:
      - n_draw
      - a1
    speak: The state had money for about ten thousand slots, and rationed them by drawing names.
  - draw:
      - n_treat
      - n_ctrl
      - a2
      - a3
    parallel: true
    speak: Thirty thousand won the chance to apply; the sixty thousand left behind became the control group.
  - draw:
      - lab_indep
    speak: Since the draw ignored everything about them, both arms carry the same distribution of potential outcomes — including the traits you could never put in a regression.
  - highlight:
      target:
        - n_draw
      effect: circle
    speak: 'And Oregon never intended an experiment: the lottery was simply the fairest way to ration scarce slots, and economists recognised a randomized trial in a bureaucratic accident.'
  - quiz:
      question: Why can't matching on observables promise the same thing?
      choices:
        - It needs a larger sample
        - It balances only what you measured
        - It cannot handle binary treatment
      correct: 2
      right: Matching balances the covariates in your dataset; the lottery balances everything, measured or not.
      wrong: Sample size is not the issue — matching can only balance the variables you actually observed.
      required: true
  - speak: Randomization never makes two people alike; it makes assignment independent of who they are — and that alone turns a difference in averages into a causal effect.
---
