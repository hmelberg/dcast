commands:
  - draw:
      - title
    speak: Now that we have the two-year results in hand, we can ask precisely what that lottery settled — and what no lottery could.
  - draw:
      - rest
    speak: Here are a hundred of the roughly thirty thousand people whose names Oregon drew from the ninety thousand who signed up.
  - pause: 0.3
  - draw:
      - group_0
      - legend_0
      - legend_rest
    speak: 'Winning raised the chance of actually being on Medicaid by about twenty-five percentage points — one in four. The rest never enrolled: paperwork unreturned, income too high, letters gone astray.'
  - highlight:
      target:
        - rest
      effect: glow
    speak: The draw was independent of potential outcomes, so winners and losers are exchangeable — but the draw is not coverage, and D, actually holding insurance, still depended on who followed through.
  - quiz:
      intro: A quick check before we go on.
      question: So what does the raw winners-minus-losers difference estimate?
      choices:
        - The effect of coverage on everyone
        - The effect of being offered coverage
        - The effect of coverage on those who enrolled
      correct: 2
      right: It is the intention-to-treat effect — the effect of the offer, diluted by the three in four who never got covered.
      wrong: 'It cannot be an effect of coverage: three quarters of these winners were never covered at all.'
  - highlight:
      target:
        - group_0
      effect: glow
    speak: Dividing that offer effect by the quarter turns it into an effect on compliers — and multiplies the confidence interval by four along with it.
  - pause: 0.5
  - clear: {}
    speak: 'Coverage moved plenty: about a third more outpatient visits, catastrophic out-of-pocket spending down four and a half points, depression screening down nine points — but on blood pressure, cholesterol and blood sugar, nothing.'
  - draw:
      - null_title
      - effect_axis
      - axis_caption
      - zero_line
      - zero_label
    speak: That silence deserves a magnifying glass, so put one outcome on a line, with zero meaning nothing moved.
  - draw:
      - est_point
      - est_label
    speak: After two years and roughly twelve thousand in-person examinations, the estimate landed at about minus half a millimetre of mercury — indistinguishable from nothing.
  - pause: 0.3
  - draw:
      - ci_bar
      - cap_lo
      - cap_hi
      - label_lo
      - label_hi
    speak: But the interval around it runs from roughly minus three to plus two millimetres.
  - quiz:
      question: What does that interval license us to say?
      choices:
        - Coverage has no effect on blood pressure
        - Coverage's effect is at most a few mm Hg
        - The experiment was badly run
      correct: 2
      right: A null bounds an effect, it does not zero it — a three-point fall still sits comfortably inside this interval.
      wrong: An interval that wide is silence, not proof of zero — it simply rules out large effects.
  - draw:
      - width_mark
    speak: 'And that width is the price of one-in-four take-up: scaling the offer up by four scales the uncertainty up by four too — the precision problem this course comes back to.'
    delivery: grave
  - pause: 0.5
  - draw:
      - limit_1
    speak: 'Randomization also says nothing about who was in the room: low-income uninsured adults who put their names on an Oregon list in 2008.'
  - draw:
      - limit_2
    speak: Nor about time — two years, for conditions that do their damage over decades.
  - draw:
      - limit_3
    speak: 'What it does buy is airtight: within these people and this window, the effect of the offer is measured without a single untestable assumption.'
  - speak: That is the trade the Oregon lottery makes, and the lesson of this whole series — randomization buys certainty about a narrow question, and everything wider is an argument you still have to make.
